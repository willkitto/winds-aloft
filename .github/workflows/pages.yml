# Publishes the iPhone/web app (webapp/) to GitHub Pages at the site root, and the design
# playground (playground/) under /playground/.
name: Web app

on:
  push:
    branches: [main]
    paths: ["webapp/**", "playground/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p site
          if [ -d webapp ]; then cp -r webapp/. site/; fi
          mkdir -p site/playground
          cp -r playground/. site/playground/
          rm -rf site/playground/tools
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
