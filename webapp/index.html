<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winds Aloft</title>
<meta name="description" content="Upper-wind forecasts at 1,000 ft steps, drawn as a column of arrows on a map. For skydivers.">
<meta name="theme-color" content="#0D3B66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winds Aloft">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="map" aria-label="Map. Long-press to pick a forecast spot."></div>
<canvas id="chart" aria-hidden="true"></canvas>
<div id="handle" role="button" aria-label="Drag to move the wind chart" hidden></div>

<header id="top" class="ui">
  <div id="demoBadge" class="pill info" hidden>Demo data (captured forecast) · <a href="./">Use live forecasts</a></div>
  <form id="searchForm" class="searchbar" role="search" autocomplete="off">
    <svg class="ico lead" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
      placeholder="Search place or lat, lon" aria-label="Search place or lat, lon">
    <button type="button" id="clearQ" class="icon-btn" aria-label="Clear search" hidden>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <button type="button" id="placesBtn" class="icon-btn" aria-label="Saved and recent places">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 18l2 1V3c0-1.1-.9-2-2-2H8.99C7.89 1 7 1.9 7 3h10c1.1 0 2 .9 2 2v13zM15 5H5c-1.1 0-2 .9-2 2v16l7-3 7 3V7c0-1.1-.9-2-2-2z"/></svg>
    </button>
    <button type="button" id="settingsBtn" class="icon-btn" aria-label="Settings">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </form>
  <ul id="results" class="card" hidden></ul>
</header>

<footer id="bottom" class="ui">
  <div id="fabs">
    <button type="button" class="fab" data-act="panelsTime" aria-label="Hide panels (keep the time slider)">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
    <button type="button" class="fab" data-act="cycleLayer" aria-label="Change map style">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg>
    </button>
    <button type="button" class="fab" data-act="refresh" aria-label="Refresh forecast">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button type="button" class="fab" data-act="myLocation" aria-label="My location">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
    </button>
  </div>

  <div id="pending" class="card row-card" hidden>
    <div class="grow">
      <div class="title">Get winds here?</div>
      <div class="sub" id="pendingCoords"></div>
    </div>
    <button type="button" class="text-btn" data-act="cancelPending">Cancel</button>
    <button type="button" class="primary-btn" data-act="confirmPending">Get winds</button>
  </div>

  <div id="hint" class="pill dark" hidden>Long-press the map to pick a forecast spot</div>
  <section id="pinPanel" class="card" aria-label="Forecast spot" hidden></section>

  <section id="controls" class="card" aria-label="Forecast controls">
    <div class="progress" hidden></div>
    <div class="labelrow"><span>Forecast</span><b class="timeLabel"></b></div>
    <input type="range" class="timeRange" min="0" max="72" step="1" value="0" aria-label="Forecast time (hours from now)">
    <div class="labelrow"><span>Altitude</span><b id="altLabel"></b></div>
    <div class="dual" id="altDual">
      <div class="dual-track"><div class="dual-fill" id="altFill"></div></div>
      <input type="range" id="altLo" min="0" max="18" step="1" value="0" aria-label="Lowest altitude (thousands of feet)">
      <input type="range" id="altHi" min="0" max="18" step="1" value="14" aria-label="Highest altitude (thousands of feet)">
    </div>
    <div id="legend"></div>
    <div class="footrow"><span id="speedLegend"></span><span class="attrib"></span></div>
  </section>

  <section id="timeOnly" hidden>
    <div class="card grow">
      <div class="progress" hidden></div>
      <div class="labelrow"><span>Forecast</span><b class="timeLabel"></b></div>
      <input type="range" class="timeRange" min="0" max="72" step="1" value="0" aria-label="Forecast time (hours from now)">
      <div class="attrib small"></div>
    </div>
    <div class="fabcol">
      <button type="button" class="fab" data-act="panelsFull" aria-label="Show all panels">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
      </button>
      <button type="button" class="fab" data-act="panelsHidden" aria-label="Hide the time slider too">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </section>

  <button type="button" id="showPanels" class="ext-fab" data-act="panelsFull" hidden>
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
    Show panels
  </button>
</footer>

<div id="toast" role="status" aria-live="polite"></div>
<div id="backdrop" hidden></div>
<section id="settingsSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="sheet-head"><h2 id="settingsTitle">Settings</h2><button type="button" class="text-btn" data-act="closeSheet">Done</button></div>
  <div class="sheet-body" id="settingsBody"></div>
</section>
<section id="placesSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="placesTitle" hidden>
  <div class="sheet-head"><h2 id="placesTitle">Places</h2><button type="button" class="text-btn" data-act="closeSheet">Done</button></div>
  <div class="sheet-body" id="placesBody"></div>
</section>

<script src="vendor/leaflet-1.9.4/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
